# Docs: https://www.serverless.com/framework/docs/providers/aws/guide/serverless.yml
# Deploy:  npm run deploy:prod
# Prerequisites: AWS CLI (IAM: CloudFormation, Lambda, API Gateway, IAM, S3, Logs).
#
# IMPORTANT — do not mix with a hand-made Lambda in the console for the same “app”.
# This project deploys: stack + Lambda + API + IAM + an S3 *deployment* bucket. Use only Serverless
# for this service, or delete the console function and deploy here so one stack owns everything.
#
# If deploy fails with: “deployment bucket … does not exist”:
#   The CloudFormation stack still points at an old Serverless artifacts bucket (bucket was deleted
#   or the stack is broken). Fix:
#   1) AWS Console → CloudFormation → stack `email-validator-<stage>` → Delete stack
#      (same region as `provider.region`, e.g. ap-south-1). If delete stalls, remove blocking resources.
#   2) CLI: aws cloudformation delete-stack --stack-name email-validator-prod --region ap-south-1
#   3) Redeploy: npm run deploy:prod
# Do not create that deployment bucket name by hand unless AWS docs instruct — a fresh deploy creates it.

service: email-validator

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 256
  # API Gateway REST integration max is 29s — align Lambda timeout for sync HTTP.
  timeout: 29
  logRetentionInDays: 14
  environment:
    NODE_ENV: ${self:provider.stage}
    LOG_LEVEL: info
    SPAMHAUS_DNS_SERVERS: "9.9.9.9,149.112.112.112"
    # dev/stage: true for local & testing. prod: false — standard Lambda blocks outbound port 25; override with env ENABLE_SMTP at deploy time.
    ENABLE_SMTP: ${env:ENABLE_SMTP, self:custom.enableSmtpByStage.${sls:stage}}

package:
  patterns:
    - "!**/tests/**"
    - "!**/postman/**"
    - "!**/*.test.js"
    - "!**/.env"
    - "!**/.env.*"
    - "!**/coverage/**"
    - "!**/*.md"
    - "!**/package-lock.json"
    - "src/**"
    - "data/**"
    - "package.json"

functions:
  validate:
    handler: src/index.handler
    description: Email validation API (syntax, MX, disposable, typo, Spamhaus, optional SMTP)
    events:
      - http:
          path: /validate
          method: post
          cors: true
      - http:
          path: /validate/batch
          method: post
          cors: true

plugins:
  - serverless-offline

custom:
  enableSmtpByStage:
    dev: "true"
    prod: "false"
    staging: "false"
    test: "true"
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
